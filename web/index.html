<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Movite — Roma in tempo reale</title>
  <meta name="theme-color" content="#0b0f1a">
  <!-- installazione come app (iPhone: Safari > Condividi > Aggiungi alla schermata Home) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- barra di stato nera e opaca: con "black-translucent" la pagina finiva sotto ora e batteria
       e la sfocatura di iOS copriva i pulsanti Metro/Tram/Bus -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Movite">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2319d3a2'/%3E%3Cpath d='M16 44V22l16 14 16-14v22' stroke='%230b0f1a' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tiles.stadiamaps.com" crossorigin>
  <!-- font caricati senza bloccare il primo disegno della pagina -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- schermata di caricamento -->
  <div id="splash">
    <div class="splash-card">
      <div class="logo big"><span class="logo-mark">M</span>ovite</div>
      <div class="splash-sub">Bus, tram e metro di Roma in tempo reale</div>
      <div class="loader"><span></span></div>
      <div id="splash-msg">Connessione al server…</div>
    </div>
  </div>

  <!-- pannello principale -->
  <!-- pulsante per riaprire la sidebar quando è chiusa -->
  <button id="panel-open" title="Apri il menu">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M13 10l2 2-2 2"/></svg>
    <span class="logo"><span class="logo-mark">M</span>ovite</span>
  </button>

  <aside id="panel">
    <div class="sheet-handle" id="sheet-handle"><span></span></div>
    <header class="panel-head">
      <div class="logo"><span class="logo-mark">M</span>ovite</div>
      <div class="head-right">
        <div class="live-pill" id="live-pill"><i></i><span>—</span></div>
        <button class="icon-btn" id="panel-close" title="Chiudi il menu">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M16 10l-2 2 2 2"/></svg></button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="explore" class="active">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Esplora</button>
      <button data-tab="plan">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>Percorso</button>
      <button data-tab="lines">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8 21l1.5-3M16 21l-1.5-3"/><circle cx="9" cy="14.5" r=".6"/><circle cx="15" cy="14.5" r=".6"/></svg>Linee</button>
      <button data-tab="alerts">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/></svg>Avvisi<b id="alerts-count"></b></button>
    </nav>

    <!-- barra fissa (non scorre col contenuto): Indietro e, sul singolo mezzo, la X per uscire -->
    <div id="view-bar" class="view-bar" hidden></div>
    <div id="view" class="view"></div>
  </aside>

  <!-- controlli mappa -->
  <div id="map-controls">
    <div class="chip-group" id="mode-filter">
      <button class="chip on" data-mode="1"><i class="dot metro"></i>Metro</button>
      <button class="chip on" data-mode="0"><i class="dot tram"></i>Tram</button>
      <button class="chip on" data-mode="3"><i class="dot bus"></i>Bus</button>
    </div>
    <div class="ctl-stack">
      <button class="ctl" id="btn-est" title="Mostra anche i bus senza GPS (posizione stimata dall'orario)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2"/></svg></button>
      <button class="ctl" id="btn-locate" title="La mia posizione">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
      <button class="ctl" id="btn-theme" title="Tema chiaro/scuro">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
